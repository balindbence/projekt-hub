name: Build

# Fut, ha felteszel egy verziocimket (pl. v1.0.0), vagy kezzel inditod a GitHubon.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fuggosegek
        run: npm install --no-audit --no-fund

      - name: Telepito epitese
        run: npm run dist

      # Kezi inditasnal: letoltheto a futas "Artifacts" reszebol
      - name: Feltoltes artifactkent
        uses: actions/upload-artifact@v4
        with:
          name: projekt-hub-windows
          path: |
            dist/*.exe
          if-no-files-found: error

      # Cimkes inditasnal: felkerul a Releases oldalra
      - name: Release keszitese
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: dist/*.exe
